<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        font-family: Roboto, Arial, sans-serif;
        margin-top: 0;
        margin-bottom: 0;
      }

      .thumbnail {
        width: 300px;
        display: block;
      }
      .search-bar {
        display: block;
      }

      .video-title {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }

      .channel-picture {
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }

      .video-info {
        display: inline-block;
        width: 245px;
      }

      .profile-picture {
        width: 80%;
        border-radius: 50px;
      }

      .thumbnail-row {
        margin-bottom: 12px;
      }

      .video-author,
      .video-stats {
        font-size: 12px;
        color: rgb(96, 96, 96);
      }

      .video-author {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
  <input class="search-bar" type="text" placeholder="Search" />
  <div>
    <!-- FIRST VIDEO CARD -->
    <div class="video-preview">
      <div class="thumbnail-row">
        <img class="thumbnail" src="Images/image.png" alt="Loading..." />
      </div>
      <div class="channel-picture">
        <img
          class="profile-picture"
          src="./profile-picture/channel-1.jpeg"
          alt="Channel Picture"
        />
      </div>
      <div class="video-info">
        <p class="video-title">
          Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
        <p class="video-stats">3.4M views &#183; 2 weeks ago</p>
        <p class="video-author">Marques Brownlee &#10003;</p>
      </div>
    </div>

    <!-- SECOND VIDEO CARD -->
    <div class="video-preview">
      <div class="thumbnail-row">
        <img class="thumbnail" src="Images/image01.png" alt="Loading..." />
      </div>
      <div class="channel-picture">
        <img
          class="profile-picture"
          src="./profile-picture/channel-1.jpeg"
          alt="Channel Picture"
        />
      </div>
      <div class="video-info">
        <p class="video-title">Try Not To Laugh Challenge #9</p>
        <p class="video-stats">19M views &#183; 4 years ago</p>
        <p class="video-author">Markiplier &#10003;</p>
      </div>
    </div>
  </div>
  </body>
</html>
